[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finecut"
version = "0.1.0"
description = "Lightweight Windows screen-crop and interface blueprinting tool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]

[project.gui-scripts]
finecut = "finecut.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["finecut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
